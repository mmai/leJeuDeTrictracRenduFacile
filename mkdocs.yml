site_name: Le Jeu de Trictrac rendu facile
site_author: Henri Bourcereau
site_url: https://mmai.github.io/leJeuDeTrictracRenduFacile/

# repository
repo_url: https://github.com/mmai/leJeuDeTrictracRenduFacile/
repo_name: code source
edit_uri: "" # disable edit button linking to repository

# files paths
docs_dir: src/
site_dir: html/

nav:
  - Présentation: index.md
  - Notice: notice.md
  - Préface: preface.md
  - Avertissement: avertissement.md
  - Introduction: introduction.md
  - Section 1: section1.md
  - Section 2: section2.md
  - Section 3: section3.md
  - Section 4: section4.md
  - Section 5: section5.md

# -----  Config for Material theme ------
theme:
  name: material
  custom_dir: overrides
  language: fr
  features:
    # - announce.dismiss
    # - content.code.annotate
    # - content.tabs.link
    - content.tooltips
    # - header.autohide
    # - navigation.expand
    - navigation.indexes
    # - navigation.instant
    # - navigation.prune
    - navigation.sections
    # - navigation.tabs
    # - navigation.tabs.sticky
    - navigation.top
    - navigation.tracking
    - search.highlight
    - search.share
    - search.suggest
    - toc.follow
    # - toc.integrate
  palette:
    # Palette toggle for automatic mode
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    # Palette toggle for light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default 
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    # Palette toggle for dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to system preference
extra:
  analytics:
    provider: plausible
    domain: mmai.github.io
    src: "https://webstats.rhumbs.fr/js/touch.js"
  social:
      - icon: fontawesome/brands/github
        link: https://github.com/mmai
      - icon: fontawesome/brands/mastodon
        link: https://mamot.fr/@mmai
